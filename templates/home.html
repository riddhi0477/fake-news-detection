<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://i.ibb.co/k8qHh4J/newspaper-bg.jpg'); /* Put your newspaper image */
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            font-family: Georgia, serif;
        }

        .title {
            text-align: center;
            margin-top: 120px;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container-box {
            width: 450px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #aaa;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 130px;
            border: 2px solid #d99;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            resize: none;
        }

        .predict-btn {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            margin-top: 12px;
            cursor: pointer;
            font-size: 16px;
        }

        .predict-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="title">
        DETECTION OF FAKE NEWS USING MACHINE LEARNING
    </div>

    <div class="container-box">
        <form action="{{ url_for('predict') }}" method="POST">
            <label>ENTER THE NEWS HERE</label><br><br>
            <textarea name="news"></textarea><br>
            <button class="predict-btn" type="submit">PREDICT</button>
        </form>
    </div>

</body>
</html>
